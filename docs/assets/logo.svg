<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="needleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  
  <!-- Compass Circle -->
  <circle cx="30" cy="30" r="26" fill="none" stroke="url(#compassGrad)" stroke-width="3"/>
  
  <!-- Inner Circle -->
  <circle cx="30" cy="30" r="20" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
  
  <!-- North Needle -->
  <polygon points="30,8 26,30 34,30" fill="url(#needleRed)"/>
  
  <!-- South Needle -->
  <polygon points="30,52 26,30 34,30" fill="#64748b"/>
  
  <!-- East/West lines -->
  <line x1="10" y1="30" x2="18" y2="30" stroke="#3b82f6" stroke-width="2"/>
  <line x1="42" y1="30" x2="50" y2="30" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Center dot -->
  <circle cx="30" cy="30" r="4" fill="#1d4ed8"/>
  <circle cx="30" cy="30" r="2" fill="#60a5fa"/>
  
  <!-- Text: Compass -->
  <text x="70" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fafafa">
    Compass
  </text>
  
  <!-- Text: by Forge -->
  <text x="70" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#3b82f6">
    by Forge
  </text>
</svg>
