<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#grad)" stroke-width="2.5"/>
  
  <!-- Inner ring -->
  <circle cx="24" cy="24" r="16" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  
  <!-- Compass rose - N -->
  <polygon points="24,5 20,24 28,24" fill="url(#red)"/>
  
  <!-- Compass rose - S -->
  <polygon points="24,43 20,24 28,24" fill="#64748b"/>
  
  <!-- Compass rose - E -->
  <polygon points="43,24 24,20 24,28" fill="#94a3b8"/>
  
  <!-- Compass rose - W -->
  <polygon points="5,24 24,20 24,28" fill="#94a3b8"/>
  
  <!-- Center -->
  <circle cx="24" cy="24" r="4" fill="#1e40af"/>
  <circle cx="24" cy="24" r="2" fill="#60a5fa"/>
</svg>
